<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch của tôi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calendar">

        <h1 id="month-year"></h1>

        <div class="header">
            <button id="prev">❮</button>
            <button id="next">❯</button>
        </div>

        <div class="weekdays">
            <div>T2</div>
            <div>T3</div>
            <div>T4</div>
            <div>T5</div>
            <div>T6</div>
            <div>T7</div>
            <div>CN</div>
        </div>

        <div class="days" id="days"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
